dose:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: jebao_doser
    head:
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    ml:
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          unit_of_measurement: mL
          mode: box
    seconds:
      selector:
        number:
          min: 0.1
          max: 120
          step: 0.1
          unit_of_measurement: s
          mode: box
